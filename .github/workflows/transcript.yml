# Fetch a YouTube transcript when the repo owner opens an issue whose title
# contains a YouTube link. The transcript is saved to yt-transcript/transcripts/
# where the web page picks it up.
name: Fetch transcript

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      url:
        description: YouTube link
        required: true

permissions:
  contents: write
  issues: write

concurrency:
  group: transcripts
  cancel-in-progress: false

jobs:
  fetch:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          pip install -U "yt-dlp[default]" youtube-transcript-api
          curl -fsSL https://deno.land/install.sh | sh -s -- -y > /dev/null
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Find the video
        id: vid
        env:
          TEXT: ${{ github.event.inputs.url || format('{0} {1}', github.event.issue.title, github.event.issue.body) }}
        run: |
          id=$(printf '%s' "$TEXT" | grep -oE '(v=|youtu\.be/|shorts/|embed/|live/)[A-Za-z0-9_-]{11}' | head -1 | grep -oE '[A-Za-z0-9_-]{11}$' || true)
          if [ -z "$id" ]; then echo "No YouTube link found."; exit 1; fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Download transcript
        run: |
          id=${{ steps.vid.outputs.id }}
          out=yt-transcript/transcripts/$id.txt
          python yt-transcript/yt_transcript.py "https://www.youtube.com/watch?v=$id" -o "$out" > /dev/null && exit 0
          echo "yt-dlp failed; trying the backup library"
          { printf 'Video: https://www.youtube.com/watch?v=%s\n\n' "$id"
            python yt-transcript/backup_transcript_api.py "$id"; } > "$out.tmp" && mv "$out.tmp" "$out" && exit 0
          rm -f "$out.tmp"; exit 1

      - name: Save it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add yt-transcript/transcripts
          git commit -m "Transcript ${{ steps.vid.outputs.id }}" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done

      - name: Close the request
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          OK: ${{ job.status }}
        run: |
          if [ "$OK" = success ]; then
            msg="Done. Go back to the Transcript Grabber page, or open https://munkachy.github.io/tools/yt-transcript/?v=${{ steps.vid.outputs.id }}"
          else
            msg="Sorry, YouTube refused this time. Try again in a few minutes, or use Paste and clean on the page."
          fi
          gh issue close ${{ github.event.issue.number }} -R ${{ github.repository }} -c "$msg"
